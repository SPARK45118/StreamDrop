<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%" style="background: #0d0c0e; border-radius: 16px;">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <style>
    .bg { fill: #0d0c0e; }
    .grid { stroke: rgba(225, 29, 72, 0.08); stroke-width: 1; }
    .floating-ring-1 {
      transform-origin: 400px 150px;
      animation: rotate3D1 18s infinite linear;
    }
    .floating-ring-2 {
      transform-origin: 400px 150px;
      animation: rotate3D2 12s infinite linear;
    }
    .logo-core {
      transform-origin: 400px 150px;
      animation: floatLogo 3.5s infinite ease-in-out;
    }
    .text-brand {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 900;
      fill: #ffffff;
      font-size: 46px;
      letter-spacing: 6px;
    }
    .text-sub {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      fill: #94a3b8;
      font-size: 13px;
      letter-spacing: 5px;
    }
    @keyframes rotate3D1 {
      0% { transform: rotateX(65deg) rotateY(15deg) rotateZ(0deg); }
      100% { transform: rotateX(65deg) rotateY(15deg) rotateZ(360deg); }
    }
    @keyframes rotate3D2 {
      0% { transform: rotateX(65deg) rotateY(-15deg) rotateZ(360deg); }
      100% { transform: rotateX(65deg) rotateY(-15deg) rotateZ(0deg); }
    }
    @keyframes floatLogo {
      0% { transform: translateY(0px) scale(1) rotateX(10deg); }
      50% { transform: translateY(-10px) scale(1.05) rotateX(0deg); }
      100% { transform: translateY(0px) scale(1) rotateX(10deg); }
    }
  </style>

  <rect width="800" height="350" class="bg" rx="16" />
  
  <!-- Perspective background grid lines -->
  <g class="grid">
    <line x1="50" y1="350" x2="400" y2="150" />
    <line x1="200" y1="350" x2="400" y2="150" />
    <line x1="350" y1="350" x2="400" y2="150" />
    <line x1="500" y1="350" x2="400" y2="150" />
    <line x1="650" y1="350" x2="400" y2="150" />
    <line x1="800" y1="350" x2="400" y2="150" />
    <circle cx="400" cy="150" r="55" fill="none" />
    <circle cx="400" cy="150" r="110" fill="none" />
    <circle cx="400" cy="150" r="170" fill="none" />
  </g>

  <!-- 3D Rotating Outer Ring -->
  <ellipse cx="400" cy="150" rx="175" ry="72" fill="none" stroke="url(#glowGrad)" stroke-width="3.5" stroke-dasharray="12, 18" class="floating-ring-1" filter="url(#glow)" />
  
  <!-- 3D Rotating Inner Ring -->
  <ellipse cx="400" cy="150" rx="115" ry="46" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="6, 12" class="floating-ring-2" />

  <!-- Glowing StreamDrop Core Logo -->
  <g class="logo-core">
    <!-- Glowing background aura -->
    <circle cx="400" cy="142" r="44" fill="url(#glowGrad)" opacity="0.85" filter="url(#glow)" />
    
    <!-- Squircle badge -->
    <rect x="372" y="114" width="56" height="56" rx="15" fill="#ffffff" />
    
    <!-- StreamDrop Stream & Arrow Icon -->
    <path d="M386 152 C390 154 395 154 400 154 C405 154 410 154 414 152" stroke="#e11d48" stroke-width="3.2" stroke-linecap="round" />
    <path d="M400 128 V145 M400 145 L392 137 M400 145 L408 137" stroke="#e11d48" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title Text -->
  <text x="400" y="272" text-anchor="middle" class="text-brand">STREAMDROP</text>
  <text x="400" y="302" text-anchor="middle" class="text-sub">HIGH-SPEED 4K MEDIA ENGINE &amp; CHROME EXTENSION</text>
</svg>
