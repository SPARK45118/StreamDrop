version: '3.8'

services:
  streamdrop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamdrop-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MAX_CONCURRENT_DOWNLOADS=3
      - CLEANUP_INTERVAL_MS=300000
      - FILE_LIFETIME_MS=600000
    volumes:
      - streamdrop-temp:/app/server/downloads/temp

volumes:
  streamdrop-temp:
